
name: Update validated equity history

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 5 * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download, convert and validate
        run: python scripts/build_history.py

      - name: Commit only validated archive
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historical-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified historical equity proxy'
            git push
          fi
